<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на свадьбу: Станислав и Мария</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Oswald:wght@200;300&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
            50% { transform: scale(1.03); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
            100% { transform: scale(1); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: 'Playfair Display', serif;
            display: flex;
            justify-content: center;
            color: #333;
            overflow-x: hidden;
        }

        .invitation {
            max-width: 500px;
            width: 90%;
            text-align: center;
            padding: 60px 20px;
            animation: fadeInUp 1.2s ease-out;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3rem, 10vw, 4.5rem);
            font-weight: normal;
            margin: 0 0 30px 0;
            color: #2c3e50;
        }

        .top-image {
            width: 100%;
            max-width: 380px;
            height: auto;
            margin-bottom: 40px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .guests-text {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 6px;
            font-size: 1.8rem;
            font-weight: 200;
            color: #555;
            margin-bottom: 20px;
        }

        .main-text {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 50px;
            font-style: italic;
            color: #666;
        }

        .calendar-container {
            display: inline-block;
            background: #fdfdfd;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #f0f0f0;
            margin-bottom: 50px;
        }

        .month-title {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        }

        .day-name {
            font-weight: bold;
            font-size: 0.8rem;
            color: #aaa;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .day {
            padding: 10px;
            font-size: 1.1rem;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .marked {
            color: #d13d3d;
            font-weight: bold;
        }

        .marked::after {
            content: '❤';
            position: absolute;
            font-size: 2.6rem;
            color: rgba(209, 61, 61, 0.15);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .day span { position: relative; z-index: 1; }

        /* Кнопка подтверждения Telegram */
        .btn-confirm {
            display: inline-block;
            padding: 18px 40px;
            background-color: #24A1DE; /* Фирменный цвет Telegram */
            color: #fff;
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 50px;
            transition: all 0.3s ease;
            animation: pulse 2s infinite ease-in-out;
        }

        .btn-confirm:hover {
            background-color: #1c82b3;
            transform: scale(1.05);
            animation: none;
        }
    </style>
</head>
<body>

<div class="invitation">
    
    <h1>Станислав и Мария</h1>

    <img src="IMG_1687.jpeg" alt="Приглашение" class="top-image">

    <div class="guests-text">Дорогие гости</div>
    
    <p class="main-text">
        С большим удовольствием приглашаем Вас<br>
        на наш первый семейный праздник — нашу свадьбу!
    </p>

    <div class="calendar-container">
        <div class="month-title">Август 2026</div>
        <div class="calendar-grid">
            <div class="day-name">ПН</div><div class="day-name">ВТ</div><div class="day-name">СР</div>
            <div class="day-name">ЧТ</div><div class="day-name">ПТ</div><div class="day-name">СБ</div>
            <div class="day-name">ВС</div>

            <div class="day"></div><div class="day"></div><div class="day"></div>
            <div class="day"></div><div class="day"></div>
            <div class="day"><span>1</span></div><div class="day"><span>2</span></div>
            
            <div class="day"><span>3</span></div><div class="day"><span>4</span></div>
            <div class="day"><span>5</span></div><div class="day"><span>6</span></div>
            <div class="day"><span>7</span></div><div class="day"><span>8</span></div>
            <div class="day"><span>9</span></div>

            <div class="day marked"><span>10</span></div> 
            
            <div class="day"><span>11</span></div><div class="day"><span>12</span></div>
            <div class="day"><span>13</span></div><div class="day"><span>14</span></div>
            <div class="day"><span>15</span></div><div class="day"><span>16</span></div>
            <div class="day"><span>17</span></div><div class="day"><span>18</span></div>
            <div class="day"><span>19</span></div><div class="day"><span>20</span></div>
            <div class="day"><span>21</span></div><div class="day"><span>22</span></div>
            <div class="day"><span>23</span></div><div class="day"><span>24</span></div>
            <div class="day"><span>25</span></div><div class="day"><span>26</span></div>
            <div class="day"><span>27</span></div><div class="day"><span>28</span></div>
            <div class="day"><span>29</span></div><div class="day"><span>30</span></div>
            <div class="day"><span>31</span></div>
        </div>
    </div>

    <br>
    <a href="https://t.me/zmariazv?text=Привет!%20Мы%20получили%20приглашение%20и%20с%20радостью%20придем%20на%20вашу%20свадьбу!" class="btn-confirm">
        Подтвердить
    </a>

</div>

</body>
</html>
