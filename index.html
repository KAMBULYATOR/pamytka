<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на свадьбу: Станислав и Мария</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Oswald:wght@200;300&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff; /* Белый фон */
            font-family: 'Playfair Display', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .invitation {
            max-width: 500px;
            width: 90%;
            text-align: center;
            padding: 40px 20px;
        }

        /* Имена Станислава и Марии в самом верху */
        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem; /* Крупный красивый шрифт */
            font-weight: normal;
            margin: 0 0 20px 0; /* Отступ снизу до картинки */
            color: #2c3e50;
        }

        /* Картинка с кольцом ТЕПЕРЬ НИЖЕ имен */
        .top-image {
            width: 100%;
            max-width: 350px;
            height: auto;
            margin-bottom: 40px; /* Отступ до текста "Дорогие гости" */
            /* Убедись, что картинка называется ring.png и лежит в той же папке */
            content: url('IMG_1687.jpeg'); 
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .guests-text {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 5px; /* Сильный разряд для стиля */
            font-size: 1.8rem;
            margin-top: 0;
            font-weight: 200;
            color: #555;
        }

        .main-text {
            font-size: 1.2rem;
            line-height: 1.7;
            margin: 25px 0 50px;
            font-style: italic;
            color: #666;
        }

        /* Стили календаря */
        .calendar-container {
            display: inline-block;
            background: #fdfdfd;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid #f0f0f0;
        }

        .month-title {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            text-align: center;
        }

        .day-name {
            font-weight: bold;
            font-size: 0.85rem;
            color: #888;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
            margin-bottom: 10px;
        }

        .day {
            padding: 10px;
            font-size: 1.1rem;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #444;
        }

        /* Выделение 10 августа 2026 */
        .marked {
            color: #d13d3d; /* Красный цвет для даты */
            font-weight: bold;
        }

        /* Красное сердечко вокруг даты 10 */
        .marked::after {
            content: '❤';
            position: absolute;
            font-size: 2.5rem;
            color: rgba(209, 61, 61, 0.2); /* Полупрозрачное сердечко */
            z-index: 0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .day span {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

<div class="invitation">
    
    <h1>Станислав и Мария</h1>

    <img src="ring.png" alt="Свадебные кольца" class="top-image">

    <div class="guests-text">Дорогие гости</div>
    
    <p class="main-text">
        С большим удовольствием приглашаем Вас<br>
        на наш первый семейный праздник — нашу свадьбу!
    </p>

    <div class="calendar-container">
        <div class="month-title">Август 2026</div>
        <div class="calendar-grid">
            <div class="day-name">ПН</div><div class="day-name">ВТ</div><div class="day-name">СР</div>
            <div class="day-name">ЧТ</div><div class="day-name">ПТ</div><div class="day-name">СБ</div>
            <div class="day-name">ВС</div>

            <div class="day"></div><div class="day"></div><div class="day"></div>
            <div class="day"></div><div class="day"></div>
            <div class="day"><span>1</span></div><div class="day"><span>2</span></div>
            
            <div class="day"><span>3</span></div><div class="day"><span>4</span></div>
            <div class="day"><span>5</span></div><div class="day"><span>6</span></div>
            <div class="day"><span>7</span></div><div class="day"><span>8</span></div>
            <div class="day"><span>9</span></div>

            <div class="day marked"><span>10</span></div> 
            
            <div class="day"><span>11</span></div><div class="day"><span>12</span></div>
            <div class="day"><span>13</span></div><div class="day"><span>14</span></div>
            <div class="day"><span>15</span></div><div class="day"><span>16</span></div>
            <div class="day"><span>17</span></div><div class="day"><span>18</span></div>
            <div class="day"><span>19</span></div><div class="day"><span>20</span></div>
            <div class="day"><span>21</span></div><div class="day"><span>22</span></div>
            <div class="day"><span>23</span></div><div class="day"><span>24</span></div>
            <div class="day"><span>25</span></div><div class="day"><span>26</span></div>
            <div class="day"><span>27</span></div><div class="day"><span>28</span></div>
            <div class="day"><span>29</span></div><div class="day"><span>30</span></div>
            <div class="day"><span>31</span></div>
        </div>
    </div>
</div>

</body>
</html>
