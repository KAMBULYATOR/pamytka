<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Приглашение на свадьбу: Станислав и Мария</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Oswald:wght@200;300&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
            background-color: #ffffff;
        }

        body {
            font-family: 'Playfair Display', serif;
            display: flex;
            justify-content: center;
            color: #333;
        }

        .invitation {
            max-width: 400px; 
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            padding: 40px 15px;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.5rem, 12vw, 3.5rem);
            margin: 0 0 20px 0;
            color: #2c3e50;
            line-height: 1.2;
        }

        .top-image {
            width: 100%;
            max-width: 380px;
            height: auto;
            margin-bottom: 30px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .guests-text {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 1.5rem;
            font-weight: 200;
            color: #555;
            margin-bottom: 15px;
        }

        .main-text {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 40px;
            font-style: italic;
            color: #666;
            padding: 0 10px;
        }

        .calendar-container {
            width: 100%;
            box-sizing: border-box;
            background: #fdfdfd;
            padding: 20px 10px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.04);
            border: 1px solid #f0f0f0;
            margin-bottom: 40px;
        }

        .month-title {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .day-name {
            font-weight: bold;
            font-size: 0.7rem;
            color: #aaa;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }

        .day {
            padding: 8px 0;
            font-size: 1rem;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .marked {
            color: #d13d3d;
            font-weight: bold;
        }

        .marked::after {
            content: '❤';
            position: absolute;
            font-size: 2.2rem;
            color: rgba(209, 61, 61, 0.15);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .day span { position: relative; z-index: 1; }

        .btn-confirm {
            display: block;
            margin: 0 20px;
            padding: 15px 0;
            background-color: #24A1DE;
            color: #fff;
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 50px;
            font-size: 0.9rem;
        }

        /* КЛАССЫ ДЛЯ АНИМАЦИИ ПРИ ПРОКРУТКЕ */

        /* Элемент скрыт (начальное состояние) */
        .reveal {
            opacity: 0;
            transform: translateY(30px); /* Смещение вниз */
            transition: all 1s ease-out; /* Время и плавность анимации */
        }

        /* Элемент появляется (состояние после прокрутки) */
        .reveal.active {
            opacity: 1;
            transform: translateY(0px); /* Возвращение на место */
        }

    </style>
</head>
<body>

<div class="invitation">
    
    <h1>Станислав и Мария</h1>
    <img src="IMG_1687.jpeg" alt="Приглашение" class="top-image">

    <div class="reveal">
        <div class="guests-text">Дорогие гости</div>
        
        <p class="main-text">
            С большим удовольствием приглашаем Вас<br>
            на наш первый семейный праздник — нашу свадьбу!
        </p>

        <div class="calendar-container">
            <div class="month-title">Август 2026</div>
            <div class="calendar-grid">
                <div class="day-name">ПН</div><div class="day-name">ВТ</div><div class="day-name">СР</div>
                <div class="day-name">ЧТ</div><div class="day-name">ПТ</div><div class="day-name">СБ</div>
                <div class="day-name">ВС</div>

                <div class="day"></div><div class="day"></div><div class="day"></div>
                <div class="day"></div><div class="day"></div>
                <div class="day"><span>1</span></div><div class="day"><span>2</span></div>
                <div class="day"><span>3</span></div><div class="day"><span>4</span></div>
                <div class="day"><span>5</span></div><div class="day"><span>6</span></div>
                <div class="day"><span>7</span></div><div class="day"><span>8</span></div>
                <div class="day"><span>9</span></div>

                <div class="day marked"><span>10</span></div> 
                
                <div class="day"><span>11</span></div><div class="day"><span>12</span></div>
                <div class="day"><span>13</span></div><div class="day"><span>14</span></div>
                <div class="day"><span>15</span></div><div class="day"><span>16</span></div>
                <div class="day"><span>17</span></div><div class="day"><span>18</span></div>
                <div class="day"><span>19</span></div><div class="day"><span>20</span></div>
                <div class="day"><span>21</span></div><div class="day"><span>22</span></div>
                <div class="day"><span>23</span></div><div class="day"><span>24</span></div>
                <div class="day"><span>25</span></div><div class="day"><span>26</span></div>
                <div class="day"><span>27</span></div><div class="day"><span>28</span></div>
                <div class="day"><span>29</span></div><div class="day"><span>30</span></div>
                <div class="day"><span>31</span></div>
            </div>
        </div>
    </div>

    <div class="reveal">
        <a href="https://t.me/твой_ник?text=Привет!%20Мы%20получили%20приглашение%20и%20с%20радостью%20придем%20на%20вашу%20свадьбу!" class="btn-confirm">
            Подтвердить в Telegram
        </a>
    </div>

</div>

<script>
    // Функция, которая проверяет, находится ли элемент в поле зрения
    function reveal() {
        var reveals = document.querySelectorAll(".reveal"); // Находим все элементы с классом reveal

        for (var i = 0; i < reveals.length; i++) {
            var windowHeight = window.innerHeight; // Высота окна браузера
            var elementTop = reveals[i].getBoundingClientRect().top; // Расстояние от верха окна до элемента
            var elementVisible = 150; // Точка, когда элемент считается видимым (чем больше, тем позже появится)

            // Если элемент вошел в поле зрения, добавляем ему класс active
            if (elementTop < windowHeight - elementVisible) {
                reveals[i].classList.add("active");
            } 
        }
    }

    // Запускаем функцию reveal при загрузке страницы и при каждом событии прокрутки
    window.addEventListener("load", reveal);
    window.addEventListener("scroll", reveal);
</script>

</body>
</html>
